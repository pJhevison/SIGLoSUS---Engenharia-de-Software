<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIGLoSUS — Alertas</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
</head>
<body data-titulo="Alertas de desabastecimento (RF11)">
  <div class="shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content">
        <section class="card">
          <h2>Alertas gerados</h2>
          <table>
            <thead><tr><th>#</th><th>Unidade</th><th>Medicamento</th><th>Risco</th><th>Situação</th><th>Gerado em</th><th>Ação</th></tr></thead>
            <tbody id="tabela-alertas"></tbody>
          </table>
          <div class="legenda">
            Os alertas são produzidos pelo padrão <strong>Observer</strong>: qualquer movimentação que deixe o
            estoque abaixo do nível mínimo dispara automaticamente um alerta.
          </div>
        </section>
      </main>
    </div>
  </div>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/paginas/alertas.js"></script>
</body>
</html>
