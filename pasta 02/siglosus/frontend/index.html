<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIGLoSUS — Acesso</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="marca">SIGLoSUS</div>
      <div class="slogan">Logística que salva vidas.</div>
      <div id="erro" class="erro" style="display:none"></div>
      <form id="form-login">
        <div style="margin-bottom:14px">
          <label for="identificador">E-mail ou CPF</label>
          <input id="identificador" name="identificador" autocomplete="username" placeholder="gestor@siglosus.gov.br" required />
        </div>
        <div style="margin-bottom:18px">
          <label for="senha">Senha</label>
          <input id="senha" name="senha" type="password" autocomplete="current-password" placeholder="••••••••" required />
        </div>
        <button class="btn" type="submit" style="width:100%;justify-content:center">Entrar</button>
      </form>

      <div class="hint" style="margin-top:18px;text-align:left">
        <strong>Esqueci minha senha (RF02)</strong>
        <div class="form-linha" style="margin-top:8px">
          <input id="email-recuperacao" type="email" placeholder="seu e-mail institucional" />
          <button class="btn pequeno" id="btn-recuperar">Solicitar</button>
        </div>
        <div id="recuperacao" style="margin-top:8px"></div>
      </div>

      <div class="hint">
        <strong>Ambiente de demonstração</strong> — usuários (senha <code>siglosus123</code>):<br />
        admin@siglosus.gov.br · gestor@siglosus.gov.br · farmaceutico@siglosus.gov.br ·
        almoxarife@siglosus.gov.br · motorista@siglosus.gov.br
      </div>
    </div>
  </div>

  <script src="assets/js/api.js"></script>
  <script>
    const form = document.getElementById('form-login');
    const erro = document.getElementById('erro');
    const sessao = Sessao.obter();
    if (sessao && sessao.token) location.href = 'dashboard.html';

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      erro.style.display = 'none';
      const botao = form.querySelector('button');
      botao.disabled = true;
      botao.textContent = 'Entrando…';
      try {
        const dados = await api.post('/auth/login', {
          identificador: document.getElementById('identificador').value,
          senha: document.getElementById('senha').value,
        });
        Sessao.salvar(dados);
        location.href = 'dashboard.html';
      } catch (ex) {
        erro.textContent = ex.message || 'Não foi possível autenticar.';
        erro.style.display = 'block';
        botao.disabled = false;
        botao.textContent = 'Entrar';
      }
    });

    /* Recuperação de senha (RF02): gera um token temporário de uso único. */
    document.getElementById('btn-recuperar').addEventListener('click', async () => {
      const alvo = document.getElementById('recuperacao');
      const email = document.getElementById('email-recuperacao').value.trim();
      if (!email) {
        alvo.textContent = 'Informe o e-mail cadastrado.';
        return;
      }
      try {
        const resposta = await api.post('/auth/recuperar-senha', { email });
        alvo.textContent = resposta.token
          ? `Token temporário: ${resposta.token} (em produção ele é enviado por e-mail).`
          : 'Se o e-mail estiver cadastrado, o token de recuperação foi enviado.';
      } catch (ex) {
        alvo.textContent = ex.message;
      }
    });
  </script>
</body>
</html>
