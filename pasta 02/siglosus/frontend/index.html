<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIGLoSUS — Acesso</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="marca">SIGLoSUS</div>
      <div class="slogan">Logística que salva vidas.</div>
      <div id="erro" class="erro" style="display:none"></div>
      <form id="form-login">
        <div style="margin-bottom:14px">
          <label for="identificador">E-mail ou CPF</label>
          <input id="identificador" name="identificador" autocomplete="username" placeholder="gestor@siglosus.gov.br" required />
        </div>
        <div style="margin-bottom:18px">
          <label for="senha">Senha</label>
          <input id="senha" name="senha" type="password" autocomplete="current-password" placeholder="••••••••" required />
        </div>
        <button class="btn" type="submit" style="width:100%;justify-content:center">Entrar</button>
      </form>
      <div class="hint">
        <strong>Ambiente de demonstração</strong> — usuários (senha <code>siglosus123</code>):<br />
        admin@siglosus.gov.br · gestor@siglosus.gov.br · farmaceutico@siglosus.gov.br ·
        almoxarife@siglosus.gov.br · motorista@siglosus.gov.br
      </div>
    </div>
  </div>

  <script src="assets/js/api.js"></script>
  <script>
    const form = document.getElementById('form-login');
    const erro = document.getElementById('erro');
    const sessao = Sessao.obter();
    if (sessao) location.href = 'dashboard.html';

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      erro.style.display = 'none';
      const botao = form.querySelector('button');
      botao.disabled = true;
      botao.textContent = 'Entrando…';
      try {
        const dados = await api.post('/auth/login', {
          identificador: document.getElementById('identificador').value,
          senha: document.getElementById('senha').value,
        });
        Sessao.salvar(dados);
        location.href = 'dashboard.html';
      } catch (ex) {
        erro.textContent = ex.message || 'Não foi possível autenticar.';
        erro.style.display = 'block';
        botao.disabled = false;
        botao.textContent = 'Entrar';
      }
    });
  </script>
</body>
</html>
