<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIGLoSUS — Redistribuição</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
</head>
<body data-titulo="Sugerir e aprovar transferências (UC13/UC14 · RF13/RF14)">
  <div class="shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content">
        <section class="card">
          <div class="acoes">
            <button class="btn" id="btn-sugerir">Gerar sugestões de transferência (UC13)</button>
          </div>
          <div class="legenda">
            Regras aplicadas: RN01 (só transfere acima do nível de segurança), RN03 (validade ≥ 90 dias)
            e RN08 (prioriza unidades mais próximas).
          </div>
        </section>

        <section class="card mt-16">
          <h2>Sugestões de transferência</h2>
          <table>
            <thead>
              <tr><th>#</th><th>Medicamento</th><th>Origem</th><th>Destino</th><th>Qtd.</th><th>Situação</th><th>Ações</th></tr>
            </thead>
            <tbody id="tabela-transferencias"></tbody>
          </table>
        </section>
      </main>
    </div>
  </div>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/paginas/redistribuicao.js"></script>
</body>
</html>
